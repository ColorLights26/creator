name: visual_catalog
description: Shared authored visual definitions and bundled GPU programs.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  scene_compositor:
    path: ../scene_compositor

flutter:
  assets:
    - assets/creator_catalog.json
    - assets/catalog_metadata.json
    - assets/creator_build_manifest.json
    - assets/thumbnails/
    - assets/images/
    - assets/native/
    - readiness/studio_readiness.json
    - readiness/revision_links.json
  shaders:
    - shaders/creator_programs.frag
