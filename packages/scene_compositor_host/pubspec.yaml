name: scene_compositor_host
description: Standalone studio registration for the shared iOS scene compositor.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SceneCompositorHostPlugin
